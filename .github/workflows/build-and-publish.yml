name: Build and Publish

on:
  workflow_call:
    inputs:
      image_tag:
        description: Primary image tag (e.g. nightly or a release version)
        required: true
        type: string
      tag_latest:
        description: Also move the latest tag
        required: false
        type: boolean
        default: false
      tag_latest_pre:
        description: Also move the latest-pre tag
        required: false
        type: boolean
        default: false

env:
  BIN_NAME: wings-rs
  PROJECT_NAME: wings-rs
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ github.repository }}

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-source.cyclonedx.json
          artifact-name: sbom-source.cyclonedx.json
          upload-artifact: true

  dist:
    name: Dist
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build:
          - x86_64-linux
          - aarch64-linux
          - riscv64-linux
          - ppc64le-linux
        include:
          - build: x86_64-linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            jemalloc_lg_page: 12
            link_flags: -C link-arg=-Wl,--icf=all -C link-arg=-Wl,-z,pack-relative-relocs
          - build: aarch64-linux
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            jemalloc_lg_page: 16
            link_flags: -C link-arg=-fuse-ld=lld -C link-arg=-B/opt/lld -C link-arg=-Wl,--icf=all
          - build: riscv64-linux
            os: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
            jemalloc_lg_page: 12
            link_flags: -C relocation-model=static
          - build: ppc64le-linux
            os: ubuntu-24.04
            target: powerpc64le-unknown-linux-gnu
            jemalloc_lg_page: 16
            link_flags: -C relocation-model=static

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked
        env:
          CARGO_BUILD_WARNINGS: allow

      - name: Run cargo test
        run: cross test --release --target ${{ matrix.target }}
        env:
          JEMALLOC_SYS_WITH_LG_PAGE: ${{ matrix.jemalloc_lg_page }}

      - name: Build release binary
        run: |
          RUSTFLAGS="-C target-feature=+crt-static ${{ matrix.link_flags }}" \
          cross build --release --target ${{ matrix.target }}
        env:
          JEMALLOC_SYS_WITH_LG_PAGE: ${{ matrix.jemalloc_lg_page }}

      - name: Prepare binary with platform name
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$BIN_NAME" "dist/$BIN_NAME-${{ matrix.build }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.build }}
          path: dist/${{ env.BIN_NAME }}-${{ matrix.build }}

  create-multiarch-image:
    name: Create multi-arch Docker image
    needs: [dist, generate-sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download source SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-source.cyclonedx.json
          path: sbom

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.PROJECT_NAME }}-*
          path: dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare binaries
        run: |
          for pair in x86_64:amd64 aarch64:arm64 riscv64:riscv64 ppc64le:ppc64le; do
            build="${pair%%:*}-linux"
            arch="${pair#*:}"
            mkdir -p ".docker/$arch"
            cp "dist/$PROJECT_NAME-$build/$BIN_NAME-$build" ".docker/$arch/calagopus-wings"
          done

          chmod +x .docker/*/calagopus-wings

      - name: Determine tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          TAG_LATEST: ${{ inputs.tag_latest }}
          TAG_LATEST_PRE: ${{ inputs.tag_latest_pre }}
        run: |
          SUFFIXES=("$IMAGE_TAG")
          [[ "$TAG_LATEST_PRE" == "true" ]] && SUFFIXES+=("latest-pre")
          [[ "$TAG_LATEST" == "true" ]] && SUFFIXES+=("latest")

          IMAGE_TAGS=""
          for t in "${SUFFIXES[@]}"; do
            IMAGE_TAGS="${IMAGE_TAGS}${IMAGE_TAGS:+,}${GHCR_IMAGE}:${t},${DOCKERHUB_IMAGE}:${t}"
          done
          echo "IMAGE_TAGS=$IMAGE_TAGS" >> $GITHUB_ENV

      - name: Build & push multi-arch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/riscv64,linux/ppc64le
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach source SBOM attestation to image (GHCR)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom/sbom-source.cyclonedx.json
          push-to-registry: true

      - name: Attach source SBOM attestation to image (Docker Hub)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom/sbom-source.cyclonedx.json
          push-to-registry: true

      - name: Sign image
        run: |
          cosign sign --yes --recursive ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          cosign sign --yes --recursive ${{ env.DOCKERHUB_IMAGE }}@${{ steps.build.outputs.digest }}
