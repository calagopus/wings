name: Release

on:
  push:
    tags:
      - "release-*"

env:
  PROJECT_NAME: wings-rs

jobs:
  release-info:
    name: Determine release info
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      version: ${{ steps.release_info.outputs.version }}
      is_prerelease: ${{ steps.release_info.outputs.is_prerelease }}
      tag_latest: ${{ steps.release_info.outputs.tag_latest }}

    steps:
      - name: Determine if pre-release and strip prefix
        id: release_info
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RAW_TAG#release-}"

          # Output the clean version to use as the Release Title
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT

            # 1.0.0 pre-releases still move 'latest'
            if [[ "$VERSION" == 1.0.0-* ]]; then
              echo "tag_latest=true" >> $GITHUB_OUTPUT
            else
              echo "tag_latest=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "tag_latest=true" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Build and Publish
    needs: [release-info]
    uses: ./.github/workflows/build-and-publish.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      image_tag: ${{ needs.release-info.outputs.version }}
      tag_latest: ${{ needs.release-info.outputs.tag_latest == 'true' }}
      tag_latest_pre: ${{ needs.release-info.outputs.is_prerelease == 'true' }}

  publish-draft-release:
    name: Publish Draft Release
    needs: [release-info, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Create Draft Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ needs.release-info.outputs.version }}
          draft: true
          prerelease: ${{ needs.release-info.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/${{ env.PROJECT_NAME }}-*/*
            artifacts/sbom-source.cyclonedx.json/sbom-source.cyclonedx.json
