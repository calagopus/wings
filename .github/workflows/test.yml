name: Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.97.0
          target: x86_64-unknown-linux-gnu
          components: rustfmt, clippy
          cache-key: x86_64-unknown-linux-gnu-test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy -p wings-rs --bin wings-rs -- -D warnings

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked

      - name: Run Linux tests
        run: cross test --release --target x86_64-unknown-linux-gnu
        env:
          JEMALLOC_SYS_WITH_LG_PAGE: 12
